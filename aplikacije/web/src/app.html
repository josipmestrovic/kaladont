<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d6f5c" />
    <script>
      // Tamna tema je zadana; svijetlu moramo primijeniti prije prvog bojanja da nema bljeska.
      try {
        if (localStorage.getItem('kaladont_tema_v1') === 'svijetla') {
          document.documentElement.setAttribute('data-tema', 'svijetla');
        }
      } catch {
        /* Tema ostaje zadana i kada preglednik zabrani lokalnu pohranu. */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
