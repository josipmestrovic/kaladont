<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d6f5c" />
    <script>
      // Tamna tema je zadana; svijetlu moramo primijeniti prije prvog bojanja da nema bljeska.
      try {
        if (localStorage.getItem('kaladont_tema_v1') === 'svijetla') {
          document.documentElement.setAttribute('data-tema', 'svijetla');
        }
      } catch {
        /* Tema ostaje zadana i kada preglednik zabrani lokalnu pohranu. */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
