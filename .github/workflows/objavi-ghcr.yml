name: Objaviti Docker sliku

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nadji-kandidata:
    name: Naći CI candidate
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      postoji: ${{ steps.candidate.outputs.postoji }}
      digest: ${{ steps.candidate.outputs.digest }}
      candidate: ${{ steps.candidate.outputs.candidate }}
    steps:
      - name: Prijaviti se u GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Postaviti Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Provjeriti candidate manifest
        id: candidate
        shell: bash
        env:
          CANDIDATE_TAG: ci-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
        run: |
          candidate="ghcr.io/josipmestrovic/kaladont:${CANDIDATE_TAG}"
          if ! digest=$(docker buildx imagetools inspect "$candidate" 2>/dev/null | awk '/^Digest:/ { print $2 }') || [[ -z "$digest" ]]; then
            echo "postoji=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Docker candidate promotion'
              echo "- Candidate \`$candidate\` ne postoji (docs-only ili CI bez slike)."
              echo '- Promocija i staging se preskaču.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "postoji=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          {
            echo '## Docker candidate promotion'
            echo "- Candidate: \`$candidate\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  objava:
    name: Objaviti sliku u GHCR
    runs-on: ubuntu-24.04
    needs: nadji-kandidata
    if: ${{ needs.nadji-kandidata.outputs.postoji == 'true' }}
    steps:
      - name: Prijaviti se u GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Postaviti Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promovirati postojeći manifest
        shell: bash
        env:
          CANDIDATE: ${{ needs.nadji-kandidata.outputs.candidate }}
          COMMIT_TAG: ghcr.io/josipmestrovic/kaladont:${{ github.event.workflow_run.head_sha }}
          MAIN_TAG: ghcr.io/josipmestrovic/kaladont:main
        run: |
          docker buildx imagetools create --tag "$COMMIT_TAG" "$CANDIDATE"
          docker buildx imagetools create --tag "$MAIN_TAG" "$CANDIDATE"

      - name: Provjeriti promovirane digest-e
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.nadji-kandidata.outputs.digest }}
          COMMIT_TAG: ghcr.io/josipmestrovic/kaladont:${{ github.event.workflow_run.head_sha }}
          MAIN_TAG: ghcr.io/josipmestrovic/kaladont:main
        run: |
          for oznaka in "$COMMIT_TAG" "$MAIN_TAG"; do
            digest=$(docker buildx imagetools inspect "$oznaka" | awk '/^Digest:/ { print $2 }')
            test "$digest" = "$EXPECTED_DIGEST"
            echo "$oznaka -> $digest"
          done
