name: Objaviti staging

on:
  workflow_run:
    workflows:
      - Objaviti Docker sliku
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  objava:
    name: Objaviti isti digest na staging
    runs-on: ubuntu-24.04
    environment: staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Preuzeti repozitorij
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prijaviti se u GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Postaviti Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Odrediti promovirani digest
        id: release
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="ghcr.io/josipmestrovic/kaladont:${COMMIT_SHA}"
          digest=$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ { print $2 }')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/josipmestrovic/kaladont@${digest}" >> "$GITHUB_OUTPUT"
          {
            echo '## Staging release'
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Digest: \`$digest\`"
            echo '- Deploy skripta na VPS-u ispisuje snapshot i fazu pada ako objava ne uspije.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pripremiti SSH vjerodajnice
        shell: bash
        env:
          SSH_KLJUC: ${{ secrets.STAGING_SSH_KLJUC }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KLJUC"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KLJUC" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Prenijeti staging konfiguracije
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          test -n "$STAGING_HOST"
          scp -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            docker-compose.staging.yml Caddyfile.staging skripte/objava-staging.sh \
            "deploy@${STAGING_HOST}:/opt/kaladont/"

      - name: Objaviti staging uz deploy snapshot
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          IMAGE_REF: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${STAGING_HOST}" \
            "chmod 700 /opt/kaladont/objava-staging.sh && /opt/kaladont/objava-staging.sh '$IMAGE_REF' '$IMAGE_DIGEST' '$RELEASE_VERSION'"

      - name: Provjeriti staging health i digest
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.release.outputs.digest }}
          EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          for pokusaj in {1..30}; do
            status=$(curl --silent --show-error --output odgovor.json --write-out '%{http_code}' https://staging.kaladont.hr/zdravlje || true)
            odgovor=$(cat odgovor.json 2>/dev/null || true)
            echo "Pokušaj ${pokusaj}: HTTP ${status:-mrežna-greška}; ${odgovor:-bez tijela}"
            if test "$status" = '200' && echo "$odgovor" | jq -e --arg digest "$EXPECTED_DIGEST" --arg verzija "$EXPECTED_VERSION" '.ok == true and .baza == "dostupna" and .digest == $digest and .verzija == $verzija' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Staging nije postao zdrav s očekivanim digestom.'
          exit 1

      - name: Preuzeti deploy snapshot na neuspjeh
        if: failure()
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-snapshot"
          if ! test -f "$RUNNER_TEMP/ssh/id_ed25519"; then
            echo 'SSH ključ nije dostupan; preskačem dohvat deploy snapshota.'
            exit 0
          fi

          snapshot=$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${STAGING_HOST}" \
            "cd /opt/kaladont && ls -1t .deploy-snapshot-* 2>/dev/null | head -n 1" || true)

          if test -z "$snapshot"; then
            echo 'Deploy snapshot nije pronađen na staging VPS-u.'
            exit 0
          fi

          if scp -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${STAGING_HOST}:/opt/kaladont/${snapshot}" \
            "$RUNNER_TEMP/deploy-snapshot/${snapshot}"; then
            echo "Preuzet deploy snapshot: ${snapshot}"
            echo "- Snapshot: \`${snapshot}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Snapshot postoji, ali dohvat nije uspio: ${snapshot}"
          fi

      - name: Spremiti deploy snapshot artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-snapshot
          path: ${{ runner.temp }}/deploy-snapshot/.deploy-snapshot-*
          if-no-files-found: ignore

      - name: Očistiti SSH vjerodajnice
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ssh"
