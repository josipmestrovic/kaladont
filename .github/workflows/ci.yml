name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provjere:
    name: Lint, test, check i build
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaladont
          POSTGRES_PASSWORD: kaladont
          POSTGRES_DB: kaladont_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaladont -d kaladont_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BAZA_URL: postgresql://kaladont:kaladont@localhost:5432/kaladont_ci
      SESIJA_TAJNA: ci-test-secret
      EMAIL_API_KLJUC: ""
      DEV_MAIL: dev@example.com
      UMAMI_URL: ""
      ONEMOGUCI_TIMER_POTEZA: "false"
      ODGODA_POCETKA_PARTIJE_MS: "0"
      ADMIN_TAJNI_KLJUC: ci-admin-secret

    steps:
      - name: Preuzeti repozitorij
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Postaviti Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Aktivirati pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Instalirati ovisnosti
        run: pnpm install --frozen-lockfile

      - name: Pokrenuti lint
        run: pnpm lint

      - name: Pokrenuti testove
        run: pnpm test

      - name: Provjeriti web aplikaciju
        run: pnpm --filter web check

      - name: Izgraditi workspace
        run: pnpm build