name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provjere:
    name: Lint, test, check i build
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaladont
          POSTGRES_PASSWORD: kaladont
          POSTGRES_DB: kaladont_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaladont -d kaladont_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BAZA_URL: postgresql://kaladont:kaladont@localhost:5432/kaladont_ci
      SESIJA_TAJNA: ci-test-secret
      EMAIL_API_KLJUC: ''
      DEV_MAIL: dev@example.com
      UMAMI_URL: ''
      ONEMOGUCI_TIMER_POTEZA: 'false'
      ODGODA_POCETKA_PARTIJE_MS: '0'
      TOLERANCIJA_PREKIDA_MS: '10000'
      ADMIN_TAJNI_KLJUC: ci-admin-secret
      CANDIDATE_TAG: ci-${{ github.sha }}-${{ github.run_id }}

    steps:
      - name: Preuzeti repozitorij
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Postaviti pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Postaviti Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalirati ovisnosti
        run: pnpm install --frozen-lockfile

      - name: Primijeniti migracije baze
        run: pnpm --filter posluzitelj migracije

      - name: Učitati sintetički CI rječnik
        run: pnpm --filter posluzitelj ci-fixture

      - name: Pokrenuti lint
        run: pnpm lint

      - name: Pokrenuti testove
        run: pnpm test

      - name: Provjeriti web aplikaciju
        run: pnpm --filter web check

      - name: Izgraditi workspace
        run: pnpm build

      - name: Instalirati Chromium za E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Pokrenuti kritične Playwright E2E testove
        run: pnpm test:e2e

      - name: Prijaviti se u GHCR za main candidate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Postaviti Docker Buildx za main candidate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/setup-buildx-action@v3

      - name: Izgraditi Docker sliku za PR
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: docker build --platform linux/amd64 -t kaladont:ci .

      - name: Izgraditi i pushati main candidate
        id: izgradi-candidate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/josipmestrovic/kaladont:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.title=Kaladont
            org.opencontainers.image.description=Hrvatska višeigračka igra riječi
            org.opencontainers.image.source=https://github.com/josipmestrovic/kaladont
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Odabrati image za smoke test
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ steps.izgradi-candidate.outputs.digest }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            test -n "${CANDIDATE_DIGEST}"
            echo "IMAGE_DIGEST=${CANDIDATE_DIGEST}" >> "$GITHUB_ENV"
            echo "IMAGE_REF=ghcr.io/josipmestrovic/kaladont@${CANDIDATE_DIGEST}" >> "$GITHUB_ENV"
            {
              echo '## Docker candidate'
              echo "- Tag: \`ghcr.io/josipmestrovic/kaladont:${CANDIDATE_TAG}\`"
              echo "- Digest: \`${CANDIDATE_DIGEST}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "IMAGE_DIGEST=ci" >> "$GITHUB_ENV"
            echo "IMAGE_REF=kaladont:ci" >> "$GITHUB_ENV"
          fi

      - name: Povuci točan image za smoke test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker pull "$IMAGE_REF"

      - name: Validirati Caddy konfiguracije
        shell: bash
        run: |
          docker run --rm \
            -e CADDY_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.9.1-alpine \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e CADDY_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile.staging:/etc/caddy/Caddyfile:ro" \
            caddy:2.9.1-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Pokrenuti CI bazu
        run: docker compose -f docker-compose.ci.yml up -d baza

      - name: Primijeniti migracije u CI imageu
        run: docker compose -f docker-compose.ci.yml run --rm aplikacija pnpm migracije

      - name: Učitati sintetički fixture u CI imageu
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps aplikacija node dist/cli/ci-fixture.js

      - name: Pokrenuti CI aplikaciju
        run: docker compose -f docker-compose.ci.yml up -d aplikacija

      - name: Provjeriti health endpoint CI imagea
        shell: bash
        run: |
          for pokusaj in {1..30}; do
            odgovor=$(curl --silent --show-error --fail http://127.0.0.1:3000/zdravlje || true)
            if echo "$odgovor" | jq -e --arg ocekivani_digest "$IMAGE_DIGEST" '.ok == true and .baza == "dostupna" and .brojRijeci > 0 and .verzija == "ci" and .digest == $ocekivani_digest' >/dev/null; then
              echo "$odgovor"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml logs aplikacija
          echo 'CI image nije postao zdrav u zadanom roku.'
          exit 1

      - name: Pokrenuti E2E nad izgrađenim same-origin serverom
        env:
          E2E_HTTP_ADRESA: http://127.0.0.1:3000
        run: pnpm test:e2e:http

      - name: Pokrenuti simulaciju četiri igrača
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps aplikacija node dist/cli/simulacija.js

      - name: Ugasi CI stack i ukloni volume
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans
