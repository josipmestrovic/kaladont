name: Promoviraj produkciju

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Puni image digest (sha256: + 64 hex) koji je prošao staging'
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: produkcija-deploy
  cancel-in-progress: false

jobs:
  promocija:
    name: Promovirati isti digest u produkciju
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: produkcija
    outputs:
      verzija: ${{ steps.release.outputs.verzija }}
      vrsta: ${{ steps.vrsta_objave.outputs.vrsta }}
      oznaka: ${{ steps.vrsta_objave.outputs.oznaka }}
      sidro: ${{ steps.vrsta_objave.outputs.sidro }}
      naslov_releasea: ${{ steps.vrsta_objave.outputs.naslov_releasea }}

    steps:
      - name: Prijaviti se u GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Postaviti Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validirati digest i izvući commit SHA
        id: release
        shell: bash
        env:
          DIGEST_ULAZ: ${{ github.event.inputs.digest }}
        run: |
          digest="$DIGEST_ULAZ"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Očekivan je puni digest oblika sha256: + 64 heksadecimalna znaka. Tag, latest i skraćeni digest nisu dopušteni."
            exit 1
          fi

          image="ghcr.io/josipmestrovic/kaladont@${digest}"
          docker buildx imagetools inspect "$image" >/dev/null

          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" crane
          chmod 755 "$RUNNER_TEMP/crane"

          verzija=$("$RUNNER_TEMP/crane" config "$image" | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
          if [[ ! "$verzija" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Slika nema valjani OCI label org.opencontainers.image.revision (puni commit SHA)."
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "verzija=$verzija" >> "$GITHUB_OUTPUT"
          {
            echo '## Produkcijska promocija'
            echo "- Ulazni digest: \`$digest\`"
            echo "- Commit (OCI revision): \`$verzija\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Staging gate — uspješan staging deploy ovog digesta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERZIJA: ${{ steps.release.outputs.verzija }}
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          test -n "$VERZIJA"
          test -n "$DIGEST"
          # GHCR commit tag može se pomaknuti novim CI runom; gate mora dokazati da je
          # uspješan „Objaviti staging” stvarno deployao BAŠ ovaj digest, ne samo isti SHA.
          # Ne koristiti `gh run view --log` + 2>/dev/null: noviji gh blokira ANSI u logovima
          # i tihi pad lažno odbija valjan staging (vidi failed runs 42202611930 / 42203210115).
          image_ref="ghcr.io/josipmestrovic/kaladont@${DIGEST}"
          run_id=""
          dokaz=""

          mapfile -t kandidati < <(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/objavi-staging.yml/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.conclusion == \"success\" and .head_sha == \"$VERZIJA\") | .id")

          if [ "${#kandidati[@]}" -eq 0 ]; then
            echo "Nema uspješnog „Objaviti staging” runa za commit $VERZIJA."
            exit 1
          fi

          for candidate in "${kandidati[@]}"; do
            echo "Provjeravam staging run ${candidate} za digest ${DIGEST}…"
            mapfile -t jobovi < <(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/jobs?per_page=100" \
              --jq '.jobs[].id')
            for job_id in "${jobovi[@]}"; do
              log_datoteka=$(mktemp)
              err_datoteka=$(mktemp)
              if gh api \
                -H "Accept: application/vnd.github+json" \
                --allow-escape-sequences \
                "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
                >"$log_datoteka" 2>"$err_datoteka"; then
                if grep -F -q -- "$image_ref" "$log_datoteka" \
                  || grep -F -q -- "IMAGE_DIGEST: ${DIGEST}" "$log_datoteka" \
                  || grep -F -q -- "EXPECTED_DIGEST: ${DIGEST}" "$log_datoteka"; then
                  rm -f "$log_datoteka" "$err_datoteka"
                  run_id=$candidate
                  dokaz="workflow-log"
                  break 2
                fi
              else
                echo "Upozorenje: log joba ${job_id} nije dohvaćen:"
                cat "$err_datoteka" || true
              fi
              rm -f "$log_datoteka" "$err_datoteka"
            done
          done

          # Dovoljan je JEDAN dokaz da je ovaj digest prošao staging:
          # 1) workflow-log (podržava produkcijski rollback dok staging već služi noviji image), ili
          # 2) živ /zdravlje koji već služi baš ovaj digest (fallback kad log API padne).
          if test -z "$run_id"; then
            zdravlje=$(mktemp)
            if ! curl --fail --silent --show-error --max-time 20 \
              https://staging.kaladont.hr/zdravlje >"$zdravlje"; then
              echo "Nema digesta u staging logovima, a /zdravlje nije dostupan."
              cat "$zdravlje" || true
              rm -f "$zdravlje"
              exit 1
            fi
            if ! jq -e --arg digest "$DIGEST" --arg verzija "$VERZIJA" \
              '.ok == true and .digest == $digest and .verzija == $verzija' \
              "$zdravlje" >/dev/null; then
              echo "Nema uspješnog staging deploya koji je objavio digest $DIGEST za commit $VERZIJA."
              echo "Logovi nemaju digest, a živ /zdravlje ne odgovara (rollback starog digesta i dalje prolazi preko workflow-log dokaza)."
              echo "Očekivano: digest=$DIGEST verzija=$VERZIJA"
              echo -n "Dobiveno: "
              jq -c '{ok,digest,verzija}' "$zdravlje" || cat "$zdravlje"
              rm -f "$zdravlje"
              exit 1
            fi
            rm -f "$zdravlje"
            run_id="${kandidati[0]}"
            dokaz="zdravlje+staging-run"
            echo "Upozorenje: digest nije pronađen u staging logovima; prihvaćam živ /zdravlje + zeleni staging run $run_id."
          fi

          echo "Staging gate OK: workflow run $run_id ($dokaz) za $image_ref."
          {
            echo "- Staging gate: uspješan run \`$run_id\` ($dokaz) za digest \`$DIGEST\` (commit \`$VERZIJA\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preuzeti repozitorij na commit slike
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.verzija }}

      # Skripte dolaze s grane workflowa da budu aktualne i pri rollbacku stare slike;
      # izdanja.json čita se s commita slike. Mora ići nakon gornjeg checkouta, koji čisti radnu mapu.
      - name: Preuzeti skripte izdanja s grane workflowa
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: _workflow
          sparse-checkout: skripte/izdanja
          persist-credentials: false

      - name: Odrediti vrstu objave i provjeriti datum izdanja
        id: vrsta_objave
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Izdanje ili tiho ažuriranje (ADR-018). Korak je namjerno prije SSH pripreme:
          # promocija novog izdanja s datumom koji nije današnji staje prije backupa i produkcije.
          oznake="$RUNNER_TEMP/oznake-izdanja.txt"
          izlaz="$RUNNER_TEMP/vrsta-objave.txt"
          poruke="$RUNNER_TEMP/vrsta-objave-poruke.txt"

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")' > "$oznake"

          kod=0
          bash _workflow/skripte/izdanja/odredi-izdanje.sh \
            --izdanja aplikacije/web/src/lib/izdanja.json \
            --oznake "$oznake" > "$izlaz" 2> "$poruke" || kod=$?
          cat "$poruke" >&2

          if [ "$kod" -ne 0 ]; then
            {
              echo '### Promocija je zaustavljena prije izmjene produkcije'
              echo
              echo '```text'
              cat "$poruke"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$kod"
          fi

          cat "$izlaz"
          cat "$izlaz" >> "$GITHUB_OUTPUT"

          vrsta=$(sed -n 's/^vrsta=//p' "$izlaz")
          oznaka=$(sed -n 's/^oznaka=//p' "$izlaz")
          nacrta=$(sed -n 's/^nacrta=//p' "$izlaz")
          razlog=$(sed -n 's/^razlog=//p' "$izlaz")
          {
            if [ "$vrsta" = 'izdanje' ]; then
              echo "- Vrsta objave: **IZDANJE ${oznaka}** (nakon provjere produkcije nastaju Git oznaka i GitHub Release)"
            else
              echo '- Vrsta objave: tiho ažuriranje (bez oznake i bez unosa u Novostima)'
            fi
            echo "- Razlog: ${razlog}"
            if [ "$vrsta" = 'tiho' ] && [ "${nacrta:-0}" -gt 0 ]; then
              echo '- **Upozorenje:** postoji nacrt izdanja. Ova objava ga ne objavljuje u Novostima; ako slika već sadrži te promjene, izlaze bez najave.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pripremiti SSH vjerodajnice
        shell: bash
        env:
          SSH_KLJUC: ${{ secrets.PROD_SSH_KLJUC }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KLJUC"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KLJUC" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Pročitati prethodni produkcijski digest
        id: prethodni
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          test -n "$PROD_HOST"
          prethodni=$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}" \
            "grep -E '^(DIGEST|VERZIJA)=' /opt/kaladont/.env || true")

          prethodni_digest=$(printf '%s\n' "$prethodni" | awk -F= '/^DIGEST=/ { print $2; exit }')
          prethodna_verzija=$(printf '%s\n' "$prethodni" | awk -F= '/^VERZIJA=/ { print $2; exit }')
          echo "digest=${prethodni_digest}" >> "$GITHUB_OUTPUT"
          echo "verzija=${prethodna_verzija}" >> "$GITHUB_OUTPUT"
          {
            echo "- Prethodni digest: \`${prethodni_digest:-nije-pronaden}\`"
            echo "- Prethodni commit: \`${prethodna_verzija:-nije-pronaden}\`"
            echo '- Ručni rollback: ponovno pokreni ovaj workflow s prethodnim digestom (shema mora biti kompatibilna).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail-closed svježi off-server backup
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          scp -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            skripte/zahtijevaj-svjez-offserver-backup.sh \
            "deploy@${PROD_HOST}:/opt/kaladont/"

          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}" \
            "chmod 700 /opt/kaladont/zahtijevaj-svjez-offserver-backup.sh && /opt/kaladont/zahtijevaj-svjez-offserver-backup.sh"

          echo '- Backup gate: potvrđen' >> "$GITHUB_STEP_SUMMARY"

      - name: Prenijeti produkcijske konfiguracije
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          scp -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml Caddyfile \
            skripte/objava-produkcija.sh \
            skripte/zahtijevaj-svjez-offserver-backup.sh \
            "deploy@${PROD_HOST}:/opt/kaladont/"

      - name: Objaviti produkciju uz kratkotrajni GHCR login
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          IMAGE_REF: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.verzija }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token samo preko stdin u docker login; privremeni DOCKER_CONFIG + logout na kraju.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}" \
            "export DOCKER_CONFIG=\$(mktemp -d) && \
             trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$DOCKER_CONFIG\"' EXIT && \
             docker login ghcr.io -u $(printf '%q' "$GHCR_USER") --password-stdin && \
             chmod 700 /opt/kaladont/objava-produkcija.sh && \
             /opt/kaladont/objava-produkcija.sh $(printf '%q' "$IMAGE_REF") $(printf '%q' "$IMAGE_DIGEST") $(printf '%q' "$RELEASE_VERSION")"

      - name: Provjeriti produkcijski health i digest
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.release.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.release.outputs.verzija }}
        run: |
          for pokusaj in {1..30}; do
            status=$(curl --silent --show-error --output odgovor.json --write-out '%{http_code}' https://kaladont.hr/zdravlje || true)
            odgovor=$(cat odgovor.json 2>/dev/null || true)
            echo "Pokušaj ${pokusaj}: HTTP ${status:-mrežna-greška}; ${odgovor:-bez tijela}"
            if test "$status" = '200' && echo "$odgovor" | jq -e --arg digest "$EXPECTED_DIGEST" --arg verzija "$EXPECTED_VERSION" '.ok == true and .baza == "dostupna" and .digest == $digest and .verzija == $verzija' >/dev/null; then
              {
                echo "- Novi digest: \`$EXPECTED_DIGEST\`"
                echo "- Novi commit: \`$EXPECTED_VERSION\`"
                echo '- Health: https://kaladont.hr/zdravlje OK'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Produkcija nije postala zdrava s očekivanim digestom.'
          exit 1

      - name: Preuzeti deploy snapshot na neuspjeh
        if: failure()
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-snapshot"
          if ! test -f "$RUNNER_TEMP/ssh/id_ed25519"; then
            echo 'SSH ključ nije dostupan; preskačem dohvat deploy snapshota.'
            exit 0
          fi
          if test -z "${PROD_HOST:-}"; then
            echo 'PROD_HOST nije dostupan; preskačem dohvat deploy snapshota.'
            exit 0
          fi

          snapshot=$(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}" \
            "cd /opt/kaladont && ls -1t .deploy-snapshot-* 2>/dev/null | head -n 1" || true)

          if test -z "$snapshot"; then
            echo 'Deploy snapshot nije pronađen na produkcijskom VPS-u.'
            exit 0
          fi

          if scp -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}:/opt/kaladont/${snapshot}" \
            "$RUNNER_TEMP/deploy-snapshot/${snapshot}"; then
            echo "Preuzet deploy snapshot: ${snapshot}"
            echo "- Snapshot: \`${snapshot}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Snapshot postoji, ali dohvat nije uspio: ${snapshot}"
          fi

      - name: Spremiti deploy snapshot artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: produkcija-deploy-snapshot
          path: ${{ runner.temp }}/deploy-snapshot/.deploy-snapshot-*
          if-no-files-found: ignore

      - name: Očistiti SSH vjerodajnice
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ssh"

  # Pokreće se samo kad je promocija uspjela i objava je ujedno izdanje (ADR-018).
  # Custom if zamjenjuje default success(), pa eksplicitno tražimo result == success —
  # inače bi job išao i nakon pala deploya/healtha ako je vrsta_objave već postavila izlaz.
  # Nema produkcijskih tajni ni Environmenta; pisanje u repozitorij ograničeno je na ovaj job.
  # Pad ovog joba ne vraća deploy: dovoljno je ponoviti samo njega („Re-run failed jobs”).
  izdanje:
    name: Objaviti CalVer oznaku i GitHub Release
    needs: promocija
    if: ${{ needs.promocija.result == 'success' && needs.promocija.outputs.vrsta == 'izdanje' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Preuzeti repozitorij na commit slike
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.promocija.outputs.verzija }}
          persist-credentials: false

      - name: Preuzeti skripte izdanja s grane workflowa
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: _workflow
          sparse-checkout: skripte/izdanja
          persist-credentials: false

      - name: Potvrditi da produkcija prikazuje izdanje
        shell: bash
        env:
          SIDRO: ${{ needs.promocija.outputs.sidro }}
        run: |
          set -euo pipefail
          test -n "$SIDRO"
          # Odgovor ide u datoteku pa u grep: curl | grep -q uz pipefail može lažno pasti.
          for pokusaj in {1..12}; do
            novosti=ne
            naslovnica=ne
            if curl --fail --silent --show-error --max-time 20 --output "$RUNNER_TEMP/novosti.html" https://kaladont.hr/novosti \
              && grep -F -q -- "id=\"${SIDRO}\"" "$RUNNER_TEMP/novosti.html"; then
              novosti=da
            fi
            if curl --fail --silent --show-error --max-time 20 --output "$RUNNER_TEMP/naslovnica.html" https://kaladont.hr/ \
              && grep -F -q -- "/novosti#${SIDRO}\"" "$RUNNER_TEMP/naslovnica.html"; then
              naslovnica=da
            fi
            echo "Pokušaj ${pokusaj}: novosti=${novosti} naslovnica=${naslovnica}"
            if [ "$novosti" = 'da' ] && [ "$naslovnica" = 'da' ]; then
              echo "- Produkcija prikazuje izdanje \`${SIDRO}\` na naslovnici i u Novostima" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Produkcija ne prikazuje izdanje ${SIDRO} na naslovnici i u Novostima."
          exit 1

      - name: Stvoriti Git oznaku i GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OZNAKA: ${{ needs.promocija.outputs.oznaka }}
          NASLOV_RELEASEA: ${{ needs.promocija.outputs.naslov_releasea }}
          VERZIJA: ${{ needs.promocija.outputs.verzija }}
        run: |
          set -euo pipefail
          test -n "$NASLOV_RELEASEA"
          if [[ ! "$OZNAKA" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Neočekivan oblik oznake izdanja: ${OZNAKA}"
            exit 1
          fi
          if [[ ! "$VERZIJA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Nedostaje puni commit SHA promovirane slike.'
            exit 1
          fi

          if gh release view "$OZNAKA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${OZNAKA} već postoji; ništa se ne mijenja."
            echo "- GitHub Release \`${OZNAKA}\` već postoji; ništa nije mijenjano" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Oznaka bez Releasea (npr. stvorena ručno) mora pokazivati na promovirani commit.
          broj_oznaka=$(gh api "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${OZNAKA}" \
            --jq "map(select(.ref == \"refs/tags/${OZNAKA}\")) | length")
          if [ "$broj_oznaka" -gt 0 ]; then
            commit_oznake=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/refs/tags/${OZNAKA}" --jq '.sha')
            if [ "$commit_oznake" != "$VERZIJA" ]; then
              echo "Oznaka ${OZNAKA} već postoji, ali pokazuje na ${commit_oznake}, a ne na promovirani commit ${VERZIJA}."
              exit 1
            fi
          fi

          bash _workflow/skripte/izdanja/biljeske-izdanja.sh \
            --izdanja aplikacije/web/src/lib/izdanja.json \
            --oznaka "$OZNAKA" > "$RUNNER_TEMP/biljeske.md"

          if ! gh release create "$OZNAKA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERZIJA" \
            --title "$NASLOV_RELEASEA" \
            --notes-file "$RUNNER_TEMP/biljeske.md" \
            --latest; then
            # GITHUB_TOKEN ne može dobiti dozvolu za workflowe, pa GitHub odbija (403/404) oznaku na
            # commitu čije workflow datoteke ne postoje na nekoj grani. Ručno stvorenu oznaku ovaj job prihvaća.
            {
              echo "### GitHub Release ${OZNAKA} nije stvoren"
              echo
              echo 'Produkcija je već uspješno objavljena; nedostaju samo Git oznaka i GitHub Release.'
              echo
              echo '1. Ponovi samo ovaj job: „Re-run failed jobs”. Ne koristi „Re-run all jobs”, jer ponavlja i deploy.'
              echo '2. Ako opet padne, mogući je uzrok da su workflow datoteke na `main` izmijenjene nakon promoviranog commita: ugrađeni token tada ne smije stvoriti oznaku na njemu. Stvori oznaku ručno, pa ponovi korak 1:'
              echo
              echo '```bash'
              echo 'gh auth refresh -h github.com -s workflow'
              echo "gh api -X POST repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/tags/${OZNAKA} -f sha=${VERZIJA}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "- Git oznaka: \`${OZNAKA}\` na commitu \`${VERZIJA}\`"
            echo "- GitHub Release: ${NASLOV_RELEASEA}"
          } >> "$GITHUB_STEP_SUMMARY"
